<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 992" width="1440" height="992" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Jarvis x Atlas — Multi-Agent Engineering OS and MCP Architecture</title>
  <desc id="arch-desc">Five-tier architecture diagram showing Policy and Multi-Provider Gateway, Co-Lead Orchestration and Lean Memory, Custom MCP Servers and Execution Lanes, Verification Harness and Deterministic Evals, and Evidence-Backed Delivery.</desc>
  <defs>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Inter", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "Consolas", "SFMono-Regular", monospace; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #0F5C54; text-transform: uppercase; }
      .title { font-size: 26px; font-weight: 700; fill: #121820; }
      .subtitle { font-size: 13px; fill: #4B5563; }
      .tier-badge { font-size: 11px; font-weight: 700; letter-spacing: 0.9px; fill: #FFFFFF; }
      .tier-title { font-size: 13px; font-weight: 700; fill: #121820; }
      .card-title { font-size: 13.5px; font-weight: 700; fill: #121820; }
      .card-sub { font-size: 11.5px; font-weight: 600; fill: #0F5C54; }
      .card-body { font-size: 11.5px; fill: #374151; }
      .metric-val { font-size: 17px; font-weight: 700; fill: #0F5C54; }
      .metric-lbl { font-size: 10.5px; font-weight: 600; fill: #4B5563; }
      .rail-title { font-size: 12.5px; font-weight: 700; fill: #7C2D12; }
      .rail-body { font-size: 11px; fill: #431407; }
      .footer { font-size: 11px; fill: #6B7280; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="992" rx="18" fill="#FAF9F5"/>
  <rect x="1" y="1" width="1438" height="990" rx="17" fill="none" stroke="#E5E1D8" stroke-width="2"/>

  <text x="40" y="42" class="sans eyebrow">SYSTEM ARCHITECTURE • AI AGENTS &amp; MODEL CONTEXT PROTOCOL</text>
  <text x="40" y="74" class="sans title">Jarvis × Atlas — Multi-Agent Engineering OS &amp; MCP Platform</text>
  <text x="40" y="96" class="sans subtitle">Co-Lead Governance • Custom JSON-RPC 2.0 MCP Servers • Lean Memory Recovery • Verify-Gated Harness • Deterministic Offline Evals</text>

  <g transform="translate(956, 26)">
    <rect x="0" y="0" width="104" height="62" rx="10" fill="#FFFFFF" stroke="#D7D2C8" stroke-width="1.2"/>
    <text x="52" y="29" text-anchor="middle" class="mono metric-val">57</text>
    <text x="52" y="48" text-anchor="middle" class="sans metric-lbl">Modular Skills</text>

    <rect x="114" y="0" width="110" height="62" rx="10" fill="#FFFFFF" stroke="#D7D2C8" stroke-width="1.2"/>
    <text x="169" y="29" text-anchor="middle" class="mono metric-val">157/157</text>
    <text x="169" y="48" text-anchor="middle" class="sans metric-lbl">Eval Pass Rate</text>

    <rect x="234" y="0" width="102" height="62" rx="10" fill="#FFFFFF" stroke="#D7D2C8" stroke-width="1.2"/>
    <text x="285" y="29" text-anchor="middle" class="mono metric-val">94/100</text>
    <text x="285" y="48" text-anchor="middle" class="sans metric-lbl">Audit Score</text>

    <rect x="346" y="0" width="98" height="62" rx="10" fill="#FFFFFF" stroke="#D7D2C8" stroke-width="1.2"/>
    <text x="395" y="29" text-anchor="middle" class="mono metric-val">&lt;=8 KiB</text>
    <text x="395" y="48" text-anchor="middle" class="sans metric-lbl">Hot Checkpoint</text>
  </g>

  <line x1="40" y1="112" x2="1400" y2="112" stroke="#E5E1D8" stroke-width="1.5"/>

  <g transform="translate(40, 128)">
    <rect x="0" y="0" width="1130" height="142" rx="14" fill="#F0F7F6" stroke="#B7DCD7" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#0F5C54"/>
    <text x="49" y="29" text-anchor="middle" class="mono tier-badge">TIER 1</text>
    <text x="96" y="30" class="sans tier-title">Entry, Governance Contract &amp; Multi-Provider LLM Gateway</text>

    <rect x="16" y="48" width="340" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="30" y="70" class="sans card-title">Human Intent &amp; Host Surfaces</text>
    <text x="30" y="89" class="sans card-body">Codex Desktop / CLI, Natural-Language Goals</text>
    <text x="30" y="108" class="mono card-sub">Zero manual skill naming • Auto-routed</text>

    <line x1="356" y1="88" x2="386" y2="88" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow-accent)"/>

    <rect x="390" y="48" width="344" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="404" y="70" class="sans card-title">Governance Contract (AGENTS.md)</text>
    <text x="404" y="89" class="sans card-body">English-normalized policy (15.8 KB, 0 duplication)</text>
    <text x="404" y="108" class="mono card-sub">Role boundaries • Safety • Evidence rules</text>

    <line x1="734" y1="88" x2="764" y2="88" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow-accent)"/>

    <rect x="768" y="48" width="346" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="782" y="70" class="sans card-title">Local LLM Gateway (Sealed Build)</text>
    <text x="782" y="89" class="sans card-body">OpenAI Responses &lt;-&gt; Gemini / Claude / Multi-Model</text>
    <text x="782" y="108" class="mono card-sub">Multi-developer preservation • SHA manifest</text>
  </g>

  <line x1="605" y1="270" x2="605" y2="298" stroke="#475569" stroke-width="2" marker-end="url(#arrow-link)"/>

  <g transform="translate(40, 302)">
    <rect x="0" y="0" width="1130" height="156" rx="14" fill="#F4F5FB" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#3730A3"/>
    <text x="49" y="29" text-anchor="middle" class="mono tier-badge">TIER 2</text>
    <text x="96" y="30" class="sans tier-title">Co-Lead Orchestration, Lean Memory Recovery &amp; Progressive Skill Routing</text>

    <rect x="16" y="48" width="356" height="94" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="30" y="70" class="sans card-title">Jarvis × Atlas Co-Lead Brain</text>
    <text x="30" y="90" class="sans card-body">Jarvis: Product, UI/UX, Reports, Visuals</text>
    <text x="30" y="108" class="sans card-body">Atlas: Architecture, Read-Only Plan, Review</text>
    <text x="30" y="128" class="mono card-sub">Single coordinator by default • Zero fake peers</text>

    <rect x="388" y="48" width="356" height="94" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="402" y="70" class="sans card-title">Lean Memory Tiering &amp; Recovery</text>
    <text x="402" y="90" class="sans card-body">Hot Checkpoint (&lt;= 8 KiB) + On-Demand Specs</text>
    <text x="402" y="108" class="sans card-body">SHA-256 provenance + anti-drift task selector</text>
    <text x="402" y="128" class="mono card-sub">Fail-closed context • Cold-start recovery CLI</text>

    <rect x="760" y="48" width="354" height="94" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="774" y="70" class="sans card-title">Progressive Skill Router (57 Skills)</text>
    <text x="774" y="90" class="sans card-body">Loads &lt;= 8 task-relevant entrypoints per turn</text>
    <text x="774" y="108" class="sans card-body">UI/UX • Diagrams • Slides • Research • TDD</text>
    <text x="774" y="128" class="mono card-sub">Pinned upstream SHA integrity checks</text>
  </g>

  <line x1="605" y1="458" x2="605" y2="486" stroke="#475569" stroke-width="2" marker-end="url(#arrow-link)"/>

  <g transform="translate(40, 490)">
    <rect x="0" y="0" width="1130" height="172" rx="14" fill="#FFF8EE" stroke="#F4CFA0" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#B45309"/>
    <text x="49" y="29" text-anchor="middle" class="mono tier-badge">TIER 3</text>
    <text x="96" y="30" class="sans tier-title">Custom MCP Servers (JSON-RPC 2.0) &amp; Multi-Agent Execution Backends</text>

    <rect x="16" y="48" width="265" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="28" y="69" class="sans card-title">jarvis-windows MCP</text>
    <text x="28" y="88" class="sans card-body">UIA-first + Native COM fallback</text>
    <text x="28" y="106" class="sans card-body">PID + HWND + processStart lock</text>
    <text x="28" y="124" class="sans card-body">SHA-256 verified CUA driver</text>
    <text x="28" y="144" class="mono card-sub">Deadlines • Conditional CUA</text>

    <rect x="295" y="48" width="265" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="307" y="69" class="sans card-title">jarvis-read-mcp Suite</text>
    <text x="307" y="88" class="sans card-body">GitHub / Discord / Telegram MCP</text>
    <text x="307" y="106" class="sans card-body">Zero-dep stdio JSON-RPC 2.0</text>
    <text x="307" y="124" class="sans card-body">DPAPI Vault + strict schemas</text>
    <text x="307" y="144" class="mono card-sub">readOnlyHint • Untrusted tag</text>

    <rect x="574" y="48" width="265" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="586" y="69" class="sans card-title">Browser, UI &amp; Media Tools</text>
    <text x="586" y="88" class="sans card-body">Chrome DevTools &amp; Playwright</text>
    <text x="586" y="106" class="sans card-body">Editorial SVG Diagram Compiler</text>
    <text x="586" y="124" class="sans card-body">Slide Studio &amp; Canva Bridge</text>
    <text x="586" y="144" class="mono card-sub">Real desktop/mobile render QA</text>

    <rect x="853" y="48" width="261" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="865" y="69" class="sans card-title">Multi-Agent &amp; Worktrees</text>
    <text x="865" y="88" class="sans card-body">Direct (0w) / Parallel (1-2 RO)</text>
    <text x="865" y="106" class="sans card-body">Orca (max 3 workers, depth 2)</text>
    <text x="865" y="124" class="sans card-body">Isolated Git Worktree CLI</text>
    <text x="865" y="144" class="mono card-sub">1 writer/path • Dirty guards</text>
  </g>

  <line x1="605" y1="662" x2="605" y2="690" stroke="#475569" stroke-width="2" marker-end="url(#arrow-link)"/>

  <g transform="translate(40, 694)">
    <rect x="0" y="0" width="1130" height="154" rx="14" fill="#F2FBF5" stroke="#B7E4C7" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="6" fill="#166534"/>
    <text x="49" y="29" text-anchor="middle" class="mono tier-badge">TIER 4</text>
    <text x="96" y="30" class="sans tier-title">Verification Gates: Long-Running Harness, Independent Hybrid Review &amp; Offline Evals</text>

    <rect x="16" y="48" width="356" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="30" y="70" class="sans card-title">Long-Running Feature Harness</text>
    <text x="30" y="89" class="sans card-body">init / add / next / verify / handoff CLI</text>
    <text x="30" y="107" class="sans card-body">Flips passes=true ONLY on real exitCode === 0</text>
    <text x="30" y="126" class="mono card-sub">Bounded &lt;= 2 KiB cross-session handoff</text>

    <rect x="388" y="48" width="356" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="402" y="70" class="sans card-title">Independent Hybrid Review v2</text>
    <text x="402" y="89" class="sans card-body">Gateway-independent diff slicing &amp; batching</text>
    <text x="402" y="107" class="sans card-body">100% file coverage + existingCode line anchors</text>
    <text x="402" y="126" class="mono card-sub">Structured severity &amp; remediation receipts</text>

    <rect x="760" y="48" width="354" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="774" y="70" class="sans card-title">Lint, Doctor, Audit &amp; 5-Suite Eval</text>
    <text x="774" y="89" class="sans card-body">1-shot Doctor (6 pillars) + Repo Audit (94/100)</text>
    <text x="774" y="107" class="sans card-body">5 offline deterministic suites (157/157 PASS)</text>
    <text x="774" y="126" class="mono card-sub">--save-baseline / --compare regression guard</text>
  </g>

  <line x1="605" y1="848" x2="605" y2="876" stroke="#475569" stroke-width="2" marker-end="url(#arrow-link)"/>

  <g transform="translate(40, 880)">
    <rect x="0" y="0" width="1130" height="72" rx="14" fill="#121820"/>
    <rect x="16" y="25" width="70" height="22" rx="6" fill="#0D9488"/>
    <text x="51" y="40" text-anchor="middle" class="mono tier-badge">TIER 5</text>
    <text x="104" y="33" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">Evidence-Backed Delivery &amp; Human Approval Boundary</text>
    <text x="104" y="54" class="sans" font-size="12" fill="#CBD5E1">Strict VERIFIED vs UNVERIFIED labeling • Reopened artifacts &amp; test receipts • Reversible backups • Explicit user sign-off for push/PR/deploy/publish</text>
  </g>

  <g transform="translate(1192, 128)">
    <rect x="0" y="0" width="208" height="824" rx="14" fill="#FFF4ED" stroke="#FDBA74" stroke-width="1.5"/>
    <rect x="16" y="16" width="176" height="26" rx="7" fill="#9A3412"/>
    <text x="104" y="33" text-anchor="middle" class="mono tier-badge">SAFETY INVARIANTS</text>

    <g transform="translate(16, 62)">
      <rect x="0" y="0" width="176" height="106" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.2"/>
      <text x="12" y="22" class="sans rail-title">1. Untrusted Data</text>
      <text x="12" y="42" class="sans rail-body">Web, logs, chat messages,</text>
      <text x="12" y="59" class="sans rail-body">and model outputs are</text>
      <text x="12" y="76" class="sans rail-body">data only — never tool or</text>
      <text x="12" y="93" class="sans rail-body">permission grants.</text>
    </g>

    <g transform="translate(16, 184)">
      <rect x="0" y="0" width="176" height="106" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.2"/>
      <text x="12" y="22" class="sans rail-title">2. Git &amp; Tree Hygiene</text>
      <text x="12" y="42" class="sans rail-body">Never reset --hard, clean</text>
      <text x="12" y="59" class="sans rail-body">-fd, or overwrite staging.</text>
      <text x="12" y="76" class="sans rail-body">Isolated worktrees for</text>
      <text x="12" y="93" class="sans rail-body">parallel branches.</text>
    </g>

    <g transform="translate(16, 306)">
      <rect x="0" y="0" width="176" height="106" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.2"/>
      <text x="12" y="22" class="sans rail-title">3. Supply Integrity</text>
      <text x="12" y="42" class="sans rail-body">SHA-256 checks on CUA</text>
      <text x="12" y="59" class="sans rail-body">driver, sealed gateway</text>
      <text x="12" y="76" class="sans rail-body">build, and pinned third-</text>
      <text x="12" y="93" class="sans rail-body">party skill blobs.</text>
    </g>

    <g transform="translate(16, 428)">
      <rect x="0" y="0" width="176" height="114" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.2"/>
      <text x="12" y="22" class="sans rail-title">4. Zero Secret Leakage</text>
      <text x="12" y="42" class="sans rail-body">Credentials stay in OS</text>
      <text x="12" y="59" class="sans rail-body">Vault / local env. Never</text>
      <text x="12" y="76" class="sans rail-body">indexed in memory or</text>
      <text x="12" y="93" class="sans rail-body">exported to public repos.</text>
    </g>

    <g transform="translate(16, 558)">
      <rect x="0" y="0" width="176" height="114" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.2"/>
      <text x="12" y="22" class="sans rail-title">5. Anti-Replay Rules</text>
      <text x="12" y="42" class="sans rail-body">SENT_UNVERIFIED !=</text>
      <text x="12" y="59" class="sans rail-body">CONFIRMED. On unknown</text>
      <text x="12" y="76" class="sans rail-body">outcome, read back state</text>
      <text x="12" y="93" class="sans rail-body">only — never blind-retry.</text>
    </g>

    <g transform="translate(16, 688)">
      <rect x="0" y="0" width="176" height="116" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.2"/>
      <text x="12" y="22" class="sans rail-title">6. Honest Evidence</text>
      <text x="12" y="42" class="sans rail-body">Separate fixtures, static</text>
      <text x="12" y="59" class="sans rail-body">readiness, inference, and</text>
      <text x="12" y="76" class="sans rail-body">live runs. Mark gaps</text>
      <text x="12" y="93" class="sans rail-body">explicitly UNVERIFIED.</text>
    </g>
  </g>

  <text x="40" y="976" class="sans footer">Jarvis × Atlas Agent OS — Open-Source Architecture Showcase (Sanitized • Zero-Dependency Node.js ESM Core • MIT License)</text>
</svg>
